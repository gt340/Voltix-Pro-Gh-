<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Dashboard — Voltix Pro GH</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{padding-bottom:1rem;}
.admin-login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.admin-login-card{width:100%;max-width:380px;padding:2rem;background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.08);border-radius:1.3rem;text-align:center;}
.admin-login-card .ic{font-size:2.6rem;margin-bottom:1rem;}
.admin-login-card h2{font-size:1.3rem;font-weight:900;margin-bottom:.4rem;}
.admin-login-card p{font-size:.82rem;color:var(--text-secondary);margin-bottom:1.5rem;}
.admin-form-field{text-align:left;margin-bottom:1rem;}
.admin-form-field label{display:block;font-size:.68rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;}
.admin-form-field input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:.85rem 1rem;border-radius:.75rem;font-size:.85rem;}
.admin-login-btn{width:100%;background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));color:#fff;font-weight:800;font-size:.88rem;padding:1rem;border-radius:.9rem;border:none;margin-top:.5rem;}
.admin-forgot-link{display:block;margin-top:1rem;font-size:.76rem;color:var(--text-muted);}

.admin-header{display:flex;justify-content:space-between;align-items:center;padding:1.1rem;position:sticky;top:0;background:rgba(6,10,20,.9);backdrop-filter:blur(20px);z-index:50;border-bottom:1px solid rgba(255,255,255,.08);}
.admin-logout-btn{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#f87171;font-size:.75rem;font-weight:700;padding:.5rem 1rem;border-radius:.6rem;}

.admin-tabs{display:flex;gap:.5rem;padding:1rem 1.1rem;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
.admin-tabs::-webkit-scrollbar{display:none;}
.admin-tab{flex:0 0 auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text-secondary);font-size:.78rem;font-weight:700;padding:.6rem 1.1rem;border-radius:999px;white-space:nowrap;}
.admin-tab.active{background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));color:#fff;border-color:transparent;}
.admin-section{display:none;padding:0 1.1rem 2rem;}
.admin-section.active{display:block;}

.admin-product-row{display:flex;align-items:center;gap:.9rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:.9rem;padding:.85rem;margin-bottom:.7rem;}
.admin-thumb{width:52px;height:52px;border-radius:.6rem;background:rgba(14,165,233,.15);display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden;flex-shrink:0;}
.admin-thumb img{width:100%;height:100%;object-fit:cover;}
.admin-row-info{flex:1;min-width:0;}
.admin-row-name{font-weight:800;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.admin-row-price{font-size:.75rem;color:var(--gold);font-weight:700;}
.admin-row-btns{display:flex;gap:.4rem;}
.admin-icon-btn{background:rgba(255,255,255,.08);border:none;color:#fff;width:2.1rem;height:2.1rem;border-radius:.5rem;font-size:.9rem;}

.file-drop{border:2px dashed rgba(14,165,233,.4);border-radius:.9rem;padding:1.5rem;text-align:center;background:rgba(14,165,233,.05);margin-bottom:.6rem;font-size:.82rem;}

.referrer-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:.9rem;padding:.9rem 1rem;margin-bottom:.6rem;}
.referrer-code-tag{font-family:monospace;font-size:.72rem;background:rgba(250,204,21,.15);color:var(--gold);padding:.3rem .6rem;border-radius:.4rem;font-weight:700;}

.admin-sale-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:1rem;padding:1rem;margin-bottom:.8rem;}
.admin-sale-top{display:flex;justify-content:space-between;margin-bottom:.6rem;}
.admin-status-pill{font-size:.65rem;font-weight:800;padding:.3rem .7rem;border-radius:999px;text-transform:uppercase;}
.status-pending{background:rgba(250,204,21,.15);color:var(--gold);}
.status-verified{background:rgba(59,130,246,.15);color:#60a5fa;}
.status-paid{background:rgba(34,197,94,.15);color:#4ade80;}
.admin-sale-detail{font-size:.78rem;color:var(--text-secondary);line-height:1.6;margin-bottom:.6rem;}
.admin-sale-commission{font-weight:900;color:var(--gold);font-size:1rem;margin-bottom:.7rem;}
.admin-sale-btns{display:flex;gap:.5rem;}
.admin-mini-btn{flex:1;padding:.55rem;border-radius:.6rem;border:none;font-weight:800;font-size:.72rem;}
.btn-verify{background:rgba(59,130,246,.2);color:#60a5fa;}
.btn-paid{background:rgba(34,197,94,.2);color:#4ade80;}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div class="admin-login-wrap" id="adminLoginWrap">
  <div class="admin-login-card">
    <div class="ic">⚙️</div>
    <h2>Admin Access</h2>
    <p>Sign in to manage Voltix Pro GH</p>
    <form onsubmit="handleAdminLoginSubmit(event)">
      <div class="admin-form-field"><label>Email</label><input type="email" id="adminEmailInput" placeholder="you@example.com" required></div>
      <div class="admin-form-field"><label>Password</label><input type="password" id="adminPasswordInput" placeholder="Enter password" required></div>
      <button type="submit" class="admin-login-btn ripple" id="adminLoginBtn">Sign In</button>
    </form>
    <button class="admin-forgot-link" onclick="handleForgotPassword()">🔑 Forgot Password?</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="adminDashboard" style="display:none;">
  <div class="admin-header">
    <div style="font-weight:900;font-size:1rem;">⚙️ Admin Dashboard</div>
    <button class="admin-logout-btn" onclick="handleAdminLogoutClick()">🚪 Logout</button>
  </div>

  <div class="admin-tabs" id="adminTabs">
    <button class="admin-tab active" data-tab="products">📦 Products</button>
    <button class="admin-tab" data-tab="add">➕ Add/Edit</button>
    <button class="admin-tab" data-tab="music">🎵 Music</button>
    <button class="admin-tab" data-tab="referrers">🎁 Referrers</button>
    <button class="admin-tab" data-tab="sales">🧾 Sales</button>
  </div>

  <!-- PRODUCTS -->
  <div class="admin-section active" id="adminsec-products">
    <div id="adminProductList"></div>
  </div>

  <!-- ADD/EDIT -->
  <div class="admin-section" id="adminsec-add">
    <form onsubmit="saveProductForm(event)">
      <input type="hidden" id="editingProductId" value="">
      <div class="admin-form-field">
        <label>Product Photos (choose multiple from your gallery)</label>
        <div class="file-drop" onclick="document.getElementById('productImageInput').click()">📁 Tap to choose photos</div>
        <input type="file" id="productImageInput" accept="image/*" multiple style="display:none;" onchange="handleProductImages(event)">
        <div class="img-chip-grid" id="productImageChips"></div>
      </div>
      <div class="admin-form-field"><label>Name</label><input type="text" id="formName" required></div>
      <div class="admin-form-field"><label>Price (Ghc)</label><input type="number" id="formPrice" required></div>
      <div class="admin-form-field"><label>Old Price (Ghc)</label><input type="number" id="formOldPrice"></div>
      <div class="admin-form-field"><label>Badge</label>
        <select id="formBadge" style="width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:.85rem 1rem;border-radius:.75rem;font-size:.85rem;">
          <option value="badge-hot|Hot Deal">🔴 Hot Deal</option>
          <option value="badge-new|New">🔵 New</option>
          <option value="badge-best|Best Seller">🟡 Best Seller</option>
          <option value="badge-value|Best Value">🟢 Best Value</option>
          <option value="badge-hot|Premium">🔷 Premium</option>
          <option value="badge-new|Gift Set">🟠 Gift Set</option>
        </select>
      </div>
      <div class="admin-form-field"><label>Category</label>
        <select id="formCategory" style="width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:.85rem 1rem;border-radius:.75rem;font-size:.85rem;">
          <option value="ring-clip">Ring-Clip · Ghc40</option>
          <option value="open-ear">Open-Ear · Ghc130</option>
          <option value="ultrapods">Ultrapods · Ghc120</option>
          <option value="sport">Sport · Ghc220</option>
        </select>
      </div>
      <div class="admin-form-field"><label>Specs</label><input type="text" id="formSpecs" placeholder="Noise Cancelling • Bluetooth 5.3 • 48h Battery"></div>
      <button type="submit" class="admin-login-btn ripple" id="saveProductBtn">💾 Save Product</button>
      <button type="button" class="admin-logout-btn" style="width:100%;margin-top:.7rem;color:#fff;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);" onclick="resetProductForm()">Clear Form</button>
    </form>
  </div>

  <!-- MUSIC — upload straight from phone file manager, multiple tracks -->
  <div class="admin-section" id="adminsec-music">
    <div class="admin-form-field">
      <label>Store Music (choose multiple MP3s from your file manager)</label>
      <div class="file-drop" onclick="document.getElementById('musicFileInput').click()">📁 Tap to choose audio files</div>
      <input type="file" id="musicFileInput" accept="audio/*" multiple style="display:none;" onchange="handleMusicFiles(event)">
      <div class="upload-progress" id="musicUploadProgress">⏳ Uploading...</div>
    </div>
    <div id="musicTrackList"></div>
  </div>

  <!-- REFERRERS -->
  <div class="admin-section" id="adminsec-referrers">
    <div id="adminReferrerList"></div>
  </div>

  <!-- SALES -->
  <div class="admin-section" id="adminsec-sales">
    <div id="adminSalesList"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
let currentImages = [];      // URLs already saved on the product being edited
let newImageFiles = [];      // File objects picked but not yet uploaded

function handleAdminLoginSubmit(e){
  e.preventDefault();
  const email = document.getElementById('adminEmailInput').value;
  const password = document.getElementById('adminPasswordInput').value;
  const btn = document.getElementById('adminLoginBtn');
  btn.textContent = 'Signing in...';
  btn.disabled = true;
  VDB.adminLogin(email, password).then(()=>{
    showToast('Welcome back!');
  }).catch(err=>{
    alert('Login failed: ' + err.message);
    btn.textContent = 'Sign In';
    btn.disabled = false;
  });
}
function handleForgotPassword(){
  const email = document.getElementById('adminEmailInput').value;
  if(!email){ alert('Type your email first, then tap Forgot Password again.'); return; }
  VDB.adminResetPassword(email).then(()=>{
    alert('✅ Reset email sent to ' + email);
  }).catch(err=> alert('Failed: ' + err.message));
}
function handleAdminLogoutClick(){
  VDB.adminLogout().then(()=>{ window.location.href = 'home.html'; });
}

document.getElementById('adminTabs').addEventListener('click', e=>{
  const btn = e.target.closest('.admin-tab');
  if(!btn) return;
  document.querySelectorAll('.admin-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.admin-section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('adminsec-'+btn.dataset.tab).classList.add('active');
});

function renderAdminProductList(){
  const list = document.getElementById('adminProductList');
  if(!list) return;
  list.innerHTML = allProducts.map(p => {
    const thumb = (p.images && p.images.length) ? p.images[0] : p.imageUrl;
    return `
    <div class="admin-product-row">
      <div class="admin-thumb">${thumb ? `<img src="${thumb}">` : (p.emoji||'🎧')}</div>
      <div class="admin-row-info">
        <div class="admin-row-name">${p.name}</div>
        <div class="admin-row-price">Ghc${p.price} ${p.oldPrice?'· was Ghc'+p.oldPrice:''}</div>
      </div>
      <div class="admin-row-btns">
        <button class="admin-icon-btn" onclick="editProduct('${p.id}')">✏️</button>
        <button class="admin-icon-btn" onclick="deleteProduct('${p.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

/* ===== MULTI-IMAGE HANDLING ===== */
function renderImageChips(){
  const box = document.getElementById('productImageChips');
  const savedChips = currentImages.map(url => `
    <div class="img-chip">
      <img src="${url}">
      <button type="button" class="img-chip-del" onclick="removeExistingImage('${url}')">✕</button>
    </div>`).join('');
  const newChips = newImageFiles.map((file,i) => `
    <div class="img-chip">
      <img src="${URL.createObjectURL(file)}">
      <button type="button" class="img-chip-del" onclick="removeNewImage(${i})">✕</button>
    </div>`).join('');
  box.innerHTML = savedChips + newChips;
}
function handleProductImages(e){
  const files = Array.from(e.target.files || []);
  newImageFiles = newImageFiles.concat(files);
  renderImageChips();
  e.target.value = '';
}
function removeExistingImage(url){
  currentImages = currentImages.filter(u => u !== url);
  renderImageChips();
}
function removeNewImage(index){
  newImageFiles.splice(index,1);
  renderImageChips();
}

function editProduct(id){
  const p = allProducts.find(x=>String(x.id)===String(id));
  if(!p) return;
  document.getElementById('editingProductId').value = p.id;
  document.getElementById('formName').value = p.name;
  document.getElementById('formPrice').value = p.price;
  document.getElementById('formOldPrice').value = p.oldPrice||'';
  document.getElementById('formSpecs').value = p.specs||'';
  document.getElementById('formBadge').value = (p.badgeClass||'badge-hot')+'|'+(p.badge||'Hot Deal');
  document.getElementById('formCategory').value = p.category||'ring-clip';
  currentImages = (p.images && p.images.length) ? [...p.images] : (p.imageUrl ? [p.imageUrl] : []);
  newImageFiles = [];
  renderImageChips();
  document.getElementById('saveProductBtn').textContent = '💾 Update Product';
  document.querySelectorAll('.admin-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='add'));
  document.querySelectorAll('.admin-section').forEach(s=>s.classList.toggle('active', s.id==='adminsec-add'));
}
function deleteProduct(id){
  if(!confirm('Remove this product?')) return;
  VDB.deleteProductById(id).catch(err=>alert('Failed: '+err.message));
}
function resetProductForm(){
  document.getElementById('editingProductId').value='';
  document.getElementById('formName').value='';
  document.getElementById('formPrice').value='';
  document.getElementById('formOldPrice').value='';
  document.getElementById('formSpecs').value='';
  currentImages = [];
  newImageFiles = [];
  renderImageChips();
  document.getElementById('saveProductBtn').textContent='💾 Save Product';
}
function saveProductForm(e){
  e.preventDefault();
  const id = document.getElementById('editingProductId').value;
  const name = document.getElementById('formName').value;
  const price = parseFloat(document.getElementById('formPrice').value);
  const oldPrice = document.getElementById('formOldPrice').value ? parseFloat(document.getElementById('formOldPrice').value) : null;
  const specs = document.getElementById('formSpecs').value;
  const category = document.getElementById('formCategory').value;
  const [badgeClass, badge] = document.getElementById('formBadge').value.split('|');
  const existing = id ? allProducts.find(p=>String(p.id)===String(id)) : null;

  const btn = document.getElementById('saveProductBtn');
  btn.textContent='⏳ Saving...'; btn.disabled=true;

  const uploadPromise = newImageFiles.length ? VDB.uploadProductImages(newImageFiles) : Promise.resolve([]);
  uploadPromise.then(newUrls=>{
    const images = [...currentImages, ...newUrls];
    const productData = {
      id: id||null, name, price, oldPrice, specs, badgeClass, badge, category,
      emoji: existing?.emoji||'🎧',
      images,
      imageUrl: images[0] || null
    };
    return VDB.saveProduct(productData);
  }).then(()=>{
    resetProductForm();
    document.querySelectorAll('.admin-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='products'));
    document.querySelectorAll('.admin-section').forEach(s=>s.classList.toggle('active', s.id==='adminsec-products'));
  }).catch(err=>alert('Failed: '+err.message)).finally(()=>{ btn.disabled=false; });
}

/* ===== MULTI-TRACK MUSIC HANDLING ===== */
function handleMusicFiles(e){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  const progress = document.getElementById('musicUploadProgress');
  progress.style.display = 'block';
  VDB.uploadMusicFiles(files).then(()=>{
    progress.style.display = 'none';
    e.target.value = '';
    showToast('Music uploaded!');
  }).catch(err=>{
    progress.style.display = 'none';
    alert('Upload failed: ' + err.message);
  });
}
function renderMusicTracks(tracks){
  const box = document.getElementById('musicTrackList');
  if(!box) return;
  if(!tracks || tracks.length===0){
    box.innerHTML = '<p style="color:var(--text-muted);font-size:.8rem;text-align:center;padding:1rem 0;">No tracks uploaded yet.</p>';
    return;
  }
  box.innerHTML = tracks.map(t => `
    <div class="track-row">
      <button type="button" class="track-play-btn" onclick="previewTrack('${t.url}')">▶</button>
      <span class="tname">${t.name}</span>
      <button type="button" class="track-del-btn" onclick="deleteMusicTrack('${t.url}')">🗑️</button>
    </div>`).join('');
}
let previewAudio = null;
function previewTrack(url){
  if(previewAudio){ previewAudio.pause(); }
  previewAudio = new Audio(url);
  previewAudio.play();
}
function deleteMusicTrack(url){
  if(!confirm('Remove this track?')) return;
  VDB.removeMusicTrack(url).catch(err=>alert('Failed: '+err.message));
}

function renderAdminReferrers(list){
  const box = document.getElementById('adminReferrerList');
  if(!box) return;
  if(list.length===0){ box.innerHTML='<p style="color:var(--text-muted);font-size:.82rem;text-align:center;padding:2rem 0;">No referrers yet.</p>'; return; }
  box.innerHTML = list.map(r=>`
    <div class="referrer-row">
      <div><b style="font-size:.85rem;">${r.name}</b><div style="font-size:.75rem;color:var(--text-muted);">📱 ${r.phone}</div></div>
      <div class="referrer-code-tag">${r.code}</div>
    </div>`).join('');
}
function renderAdminSales(list){
  const box = document.getElementById('adminSalesList');
  if(!box) return;
  if(list.length===0){ box.innerHTML='<p style="color:var(--text-muted);font-size:.82rem;text-align:center;padding:2rem 0;">No referral sales yet.</p>'; return; }
  box.innerHTML = list.map(s=>`
    <div class="admin-sale-card">
      <div class="admin-sale-top">
        <b style="font-size:.85rem;">${s.refCode}</b>
        <span class="admin-status-pill status-${s.status}">${s.status}</span>
      </div>
      <div class="admin-sale-detail">👤 ${s.customerName} · 📱 ${s.customerPhone}<br>📦 ${s.orderRef} · ${s.itemsSummary}</div>
      <div class="admin-sale-commission">Commission: Ghc${s.commission}</div>
      <div class="admin-sale-btns">
        <button class="admin-mini-btn btn-verify" onclick="VDB.updateReferralSaleStatus('${s.id}','verified')">✅ Verified</button>
        <button class="admin-mini-btn btn-paid" onclick="VDB.updateReferralSaleStatus('${s.id}','paid')">💰 Paid</button>
      </div>
    </div>`).join('');
}

function initAdminDashboard(){
  VDB.subscribeProducts(list=>{ allProducts = list; renderAdminProductList(); });
  VDB.subscribeMusic(tracks=>{ renderMusicTracks(tracks); });
  VDB.subscribeReferrers(renderAdminReferrers);
  VDB.subscribeReferralSales(renderAdminSales);
}

function checkAdminAuthState(){
  if(!VDB){ window.addEventListener('vdb-ready', checkAdminAuthState); return; }
  VDB.watchAdminAuth(user=>{
    if(user){
      document.getElementById('adminLoginWrap').style.display='none';
      document.getElementById('adminDashboard').style.display='block';
      initAdminDashboard();
    } else {
      document.getElementById('adminLoginWrap').style.display='flex';
      document.getElementById('adminDashboard').style.display='none';
    }
  });
}
checkAdminAuthState();
</script>
</body>
</html>
