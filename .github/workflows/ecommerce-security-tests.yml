name: Ecommerce security tests

on:
  push:
    branches:
      - feature/ecommerce-checkout-security
  pull_request:
    branches:
      - main
      - feature/ecommerce-checkout-security

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check backend syntax
        run: node --check spin-backend/server.js && node --check spin-backend/ecommerce/payments.js && node --check spin-backend/ecommerce/expiry-worker.js
      - name: Run regression suite
        run: npm test
