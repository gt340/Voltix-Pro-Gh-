name: Test
on:
  push:
    branches:
      - phase2b/firestore-hardening
  pull_request:
    branches:
      - main
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-package-lock
      - run: npm test
      - run: npx firebase emulators:exec --project demo-voltix-rules --only firestore "npm run test:firestore-emulator"
