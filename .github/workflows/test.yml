name: Test
on:
  push:
    branches:
      - phase2b/firestore-hardening
  pull_request:
    branches:
      - main
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - run: npm test
