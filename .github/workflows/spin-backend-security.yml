name: Spin Backend Security Tests

on:
  push:
    branches:
      - phase2b2/spin-backend-hardening
      - phase2b4a/shopper-identity-foundation
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/firestore-rules.test.js'
      - 'tests/payments.test.js'
      - 'tests/shopper-wallet.test.js'
      - 'spin-backend/**'
      - '.github/workflows/spin-backend-security.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spin-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install root test dependencies
        working-directory: .
        run: npm install --no-audit --no-fund
      - name: Run Firestore rules against emulator
        working-directory: .
        run: npm run test:rules
      - name: Check backend syntax
        run: node --check server.js
      - name: Run backend regression suite
        run: npm test
