name: Spin Backend Security Tests

permissions:
  contents: write

on:
  push:
    branches:
      - phase2b2/spin-backend-hardening
      - phase2b4a/shopper-identity-foundation
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/firestore-rules.test.js'
      - 'tests/payments.test.js'
      - 'tests/shopper-wallet.test.js'
      - 'spin-backend/**'
      - 'spin.html'
      - '.github/workflows/spin-backend-security.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spin-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install root test dependencies
        working-directory: .
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Generate reproducible root npm lockfile
        working-directory: .
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated root npm lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Root lockfile is already current."
          else
            git commit -m "Add reproducible root npm lockfile"
            git push origin HEAD:security/shopper-wallet-ownership-guards
          fi
      - name: Upload generated root npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: root-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Run Firestore rules against emulator
        working-directory: .
        run: npm run test:rules
      - name: Check backend syntax
        run: node --check server.js
      - name: Run backend regression suite
        run: npm test
