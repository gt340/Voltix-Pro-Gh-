name: Spin backend tests

on:
  push:
    branches:
      - phase3/arkesel-otp-auth
  pull_request:
    paths:
      - "spin-backend/**"
      - "shopper-auth-diagnostics.js"
      - "app.js"
      - "account.html"
      - "firestore.rules"
      - ".github/workflows/spin-backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spin-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check backend syntax
        run: |
          node --check server.js
          node --check arkesel-otp.js
          node --check otp-auth.js
      - name: Run regression and OTP tests
        run: npm test
