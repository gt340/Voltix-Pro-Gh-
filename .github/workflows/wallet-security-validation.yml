name: Wallet Security Validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Repository ref to validate (branch, tag, or commit SHA)"
        required: true
        type: string
        default: "security/shopper-wallet-ownership-guards"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/wallet-security-validation.yml"
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "tests/firestore-rules.test.js"
      - "tests/payments.test.js"
      - "tests/shopper-wallet.test.js"
      - "spin-backend/**"

permissions:
  contents: read

concurrency:
  group: wallet-security-validation-${{ github.event.pull_request.number || inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  wallet-security:
    name: Firestore rules and backend regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out requested code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.inputs.source_ref || 'security/shopper-wallet-ownership-guards' }}

      - name: Verify checked-out source and required test script
        run: |
          echo "Checked-out commit: $(git rev-parse HEAD)"
          echo "Workflow event: ${GITHUB_EVENT_NAME}"
          node -e "const p=require('./package.json'); console.log('Root package:', require('path').resolve('package.json')); console.log('Available scripts:', JSON.stringify(p.scripts || {}, null, 2)); if (!p.scripts || !p.scripts['test:rules']) { console.error('ERROR: Checked-out ref does not define the required test:rules script.'); process.exit(1); }"
          test -f tests/firestore-rules.test.js || { echo "ERROR: tests/firestore-rules.test.js is missing from the checked-out ref."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.12.0"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root test dependencies
        run: npm install --no-audit --no-fund

      - name: Run Firestore wallet security rules tests
        run: npm run test:rules

      - name: Check backend JavaScript syntax
        working-directory: spin-backend
        run: node --check server.js

      - name: Run backend regression suite
        working-directory: spin-backend
        run: npm test
