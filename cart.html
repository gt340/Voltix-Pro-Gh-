<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Cart — Voltix Pro GH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1.5rem;text-align:center;}
.cart-empty .ic{font-size:4rem;margin-bottom:1.2rem;opacity:.5;}
.cart-empty h3{font-size:1.15rem;font-weight:900;margin-bottom:.5rem;}
.cart-empty p{font-size:.85rem;color:var(--text-secondary);margin-bottom:1.5rem;}
.cart-empty-btn{background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));color:#fff;font-weight:800;font-size:.85rem;padding:.9rem 1.8rem;border-radius:.9rem;border:none;}

.cart-list{padding:1rem 1.1rem 0;}
.cart-item-card{
  display:flex;gap:.9rem;padding:1rem;margin-bottom:.9rem;
  background:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.08);border-radius:1.1rem;
  animation:itemSlideIn .35s cubic-bezier(.22,1,.36,1);
  transition:opacity .3s, transform .3s, max-height .3s;
}
.cart-item-card.removing{opacity:0;transform:translateX(-30px);max-height:0;padding:0;margin:0;overflow:hidden;border-width:0;}
@keyframes itemSlideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.ci-img{width:76px;height:76px;border-radius:.8rem;background:linear-gradient(150deg,rgba(14,165,233,.2),rgba(30,64,175,.12));display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden;flex-shrink:0;}
.ci-img img{width:100%;height:100%;object-fit:cover;}
.ci-info{flex:1;min-width:0;display:flex;flex-direction:column;}
.ci-name{font-size:.85rem;font-weight:800;line-height:1.3;margin-bottom:.25rem;}
.ci-specs{font-size:.68rem;color:var(--text-muted);margin-bottom:.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ci-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.ci-price{font-size:.95rem;font-weight:900;background:linear-gradient(90deg,var(--gold),var(--blue-electric));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ci-qty{display:flex;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:.6rem;overflow:hidden;}
.ci-qty button{width:1.9rem;height:1.9rem;background:none;border:none;color:#fff;font-size:.95rem;font-weight:800;}
.ci-qty .val{width:1.8rem;text-align:center;font-weight:800;font-size:.82rem;}
.ci-remove{position:absolute;top:.7rem;right:.7rem;background:none;border:none;color:var(--text-muted);font-size:.9rem;}
.cart-item-card{position:relative;}

.coupon-box{margin:1.3rem 1.1rem 0;padding:1rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:1rem;}
.coupon-row{display:flex;gap:.6rem;}
.coupon-row input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:.75rem 1rem;border-radius:.7rem;font-size:.82rem;}
.coupon-row input::placeholder{color:var(--text-muted);}
.coupon-row button{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:var(--navy-deep);font-weight:800;font-size:.78rem;padding:0 1.2rem;border-radius:.7rem;border:none;white-space:nowrap;}
.coupon-applied{display:flex;align-items:center;justify-content:space-between;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:.7rem;padding:.7rem 1rem;font-size:.8rem;font-weight:700;color:#4ade80;}
.coupon-applied button{background:none;border:none;color:#f87171;font-size:.8rem;font-weight:800;}

.delivery-box{margin:1.1rem 1.1rem 0;padding:1rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:1rem;}
.delivery-box h4{font-size:.72rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem;}
.delivery-option{display:flex;align-items:center;justify-content:space-between;padding:.8rem;margin-bottom:.6rem;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08);border-radius:.8rem;}
.delivery-option.selected{border-color:var(--blue-electric);background:rgba(14,165,233,.1);}
.delivery-option:last-child{margin-bottom:0;}
.delivery-left{display:flex;align-items:center;gap:.7rem;}
.delivery-left input{width:1.1rem;height:1.1rem;accent-color:var(--blue-electric);}
.delivery-text b{display:block;font-size:.82rem;}
.delivery-text span{font-size:.68rem;color:var(--text-muted);}
.delivery-price{font-size:.82rem;font-weight:800;color:var(--gold);}

.summary-box{margin:1.1rem 1.1rem 1.3rem;padding:1.2rem;background:linear-gradient(150deg,rgba(30,64,175,.18),rgba(14,165,233,.08));border:1px solid rgba(14,165,233,.25);border-radius:1.1rem;}
.summary-row{display:flex;justify-content:space-between;padding:.5rem 0;font-size:.85rem;color:var(--text-secondary);}
.summary-row.discount{color:#4ade80;}
.summary-row.total{border-top:1px solid rgba(255,255,255,.12);margin-top:.5rem;padding-top:.9rem;font-size:1.1rem;font-weight:900;color:#fff;}
.summary-row.total .amt{background:linear-gradient(90deg,var(--gold),var(--blue-electric));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.pd-buynow-btn{background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));color:#fff;font-weight:900;font-size:.95rem;padding:1.1rem;border-radius:1rem;border:none;box-shadow:0 10px 30px rgba(14,165,233,.4);}
</style>
</head>
<body>

<header class="app-topbar">
  <a href="home.html" class="topbar-logo">
    <img src="logo.jpg" alt="Voltix Pro GH" onerror="this.style.display='none'">
    <div class="topbar-logo-text"><b>VOLTIX</b><span>PRO GH</span></div>
  </a>
  <div style="font-weight:800;font-size:.95rem;">Your Cart</div>
  <div style="width:2.5rem;"></div>
</header>

<div id="cartEmptyState" class="cart-empty" style="display:none;">
  <div class="ic">🛒</div>
  <h3>Your cart is empty</h3>
  <p>Add some premium earpods to get started</p>
  <a href="shop.html" class="cart-empty-btn ripple">🛍️ Start Shopping</a>
</div>

<div id="cartContent">
  <div class="cart-list" id="cartListContainer"></div>

  <div class="coupon-box">
    <div id="couponInputArea">
      <div class="coupon-row">
        <input type="text" id="couponInput" placeholder="Enter coupon code">
        <button class="ripple" onclick="applyCoupon()">Apply</button>
      </div>
    </div>
    <div id="couponAppliedArea" style="display:none;">
      <div class="coupon-applied">
        <span id="couponAppliedText">✅ WELCOME10 applied — 10% off</span>
        <button onclick="removeCoupon()">Remove</button>
      </div>
    </div>
  </div>

  <div class="delivery-box">
    <h4>🚚 Delivery Method</h4>
    <label class="delivery-option selected" id="deliveryStandard">
      <div class="delivery-left">
        <input type="radio" name="delivery" checked onclick="selectDelivery('standard', 0, this)">
        <div class="delivery-text"><b>Standard Delivery</b><span>1-3 business days</span></div>
      </div>
      <span class="delivery-price">Free</span>
    </label>
    <label class="delivery-option" id="deliveryExpress">
      <div class="delivery-left">
        <input type="radio" name="delivery" onclick="selectDelivery('express', 20, this)">
        <div class="delivery-text"><b>Express Delivery</b><span>Same day (Accra only)</span></div>
      </div>
      <span class="delivery-price">Ghc20</span>
    </label>
  </div>

  <div class="summary-box">
    <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">Ghc0</span></div>
    <div class="summary-row discount" id="sumDiscountRow" style="display:none;"><span>Coupon Discount</span><span id="sumDiscount">-Ghc0</span></div>
    <div class="summary-row"><span>Delivery</span><span id="sumDelivery">Free</span></div>
    <div class="summary-row total"><span>Total</span><span class="amt" id="sumTotal">Ghc0</span></div>
  </div>

  <div style="padding:0 1.1rem 1.5rem;">
    <button class="pd-buynow-btn ripple" style="width:100%;" onclick="window.location.href='checkout.html'">🔒 Proceed to Checkout</button>
    <a href="shop.html" style="display:block;text-align:center;margin-top:1rem;font-size:.82rem;color:var(--blue-electric);font-weight:700;">← Continue Shopping</a>
  </div>
</div>

<nav class="bottom-nav">
  <a href="home.html" class="nav-item" data-page="home"><span class="nav-icon">🏠</span>Home</a>
  <a href="shop.html" class="nav-item" data-page="shop"><span class="nav-icon">🛍️</span>Shop</a>
  <a href="cart.html" class="nav-item" data-page="cart"><span class="nav-icon">🛒</span>Cart<span class="nav-count" id="navCartCount2" style="display:none;">0</span></a>
  <a href="account.html" class="nav-item" data-page="account"><span class="nav-icon">👤</span>Account</a>
</nav>

<script src="app.js"></script>
<script>
let appliedCoupon = null;
let selectedDeliveryMethod = 'standard';
let selectedDeliveryPrice = 0;

const VALID_COUPONS = {
  'WELCOME10': { percent: 10, label: 'WELCOME10 — 10% off' },
  'VOLTIX20': { percent: 20, label: 'VOLTIX20 — 20% off' }
};

function renderCartPage(){
  const listEl = document.getElementById('cartListContainer');
  const emptyEl = document.getElementById('cartEmptyState');
  const contentEl = document.getElementById('cartContent');

  if(cart.length === 0){
    emptyEl.style.display = 'flex';
    contentEl.style.display = 'none';
    return;
  }
  emptyEl.style.display = 'none';
  contentEl.style.display = 'block';

  listEl.innerHTML = cart.map(item => {
    const lid = item.lineId || item.id;
    const subLine = item.variantName ? `Colour: ${item.variantName}` : (item.sku ? `SKU: ${item.sku}` : '');
    return `
    <div class="cart-item-card" id="cartcard-${lid}">
      <button class="ci-remove" onclick="removeCartItem('${lid}')">✕</button>
      <div class="ci-img">${item.image ? mediaTagHTML(item.image, item.name, '', 'f_auto,q_auto,w_200') : (item.emoji||'🎧')}</div>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        ${subLine ? `<div class="ci-specs">${subLine}</div>` : ''}
        <div class="ci-bottom">
          <span class="ci-price">Ghc${item.price * item.qty}</span>
          <div class="ci-qty">
            <button onclick="cartQtyChange('${lid}', -1)">−</button>
            <span class="val">${item.qty}</span>
            <button onclick="cartQtyChange('${lid}', 1)">+</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  updateSummary();
}

function cartQtyChange(lineId, delta){
  const item = cart.find(i=>(i.lineId||i.id)===lineId);
  if(!item) return;
  updateCartQty(lineId, item.qty + delta);
}

function removeCartItem(lineId){
  const card = document.getElementById('cartcard-'+lineId);
  if(card) card.classList.add('removing');
  setTimeout(()=>{ removeFromCart(lineId); renderCartPage(); }, 280);
}

function selectDelivery(method, price, el){
  document.querySelectorAll('.delivery-option').forEach(o=>o.classList.remove('selected'));
  el.closest('.delivery-option').classList.add('selected');
  selectedDeliveryMethod = method;
  selectedDeliveryPrice = price;
  updateSummary();
}

function applyCoupon(){
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  if(!code){ showToast('Enter a coupon code'); return; }
  if(VALID_COUPONS[code]){
    appliedCoupon = { code, ...VALID_COUPONS[code] };
    document.getElementById('couponInputArea').style.display = 'none';
    document.getElementById('couponAppliedArea').style.display = 'block';
    document.getElementById('couponAppliedText').textContent = '✅ ' + appliedCoupon.label;
    showToast('Coupon applied!');
    updateSummary();
  } else {
    showToast('Invalid coupon code');
  }
}
function removeCoupon(){
  appliedCoupon = null;
  document.getElementById('couponInputArea').style.display = 'block';
  document.getElementById('couponAppliedArea').style.display = 'none';
  document.getElementById('couponInput').value = '';
  updateSummary();
}

function updateSummary(){
  const subtotal = cartTotal();
  let discount = 0;
  if(appliedCoupon){
    discount = Math.round(subtotal * appliedCoupon.percent / 100);
  }
  const total = Math.max(0, subtotal - discount) + selectedDeliveryPrice;

  document.getElementById('sumSubtotal').textContent = `Ghc${subtotal}`;
  if(discount > 0){
    document.getElementById('sumDiscountRow').style.display = 'flex';
    document.getElementById('sumDiscount').textContent = `-Ghc${discount}`;
  } else {
    document.getElementById('sumDiscountRow').style.display = 'none';
  }
  document.getElementById('sumDelivery').textContent = selectedDeliveryPrice > 0 ? `Ghc${selectedDeliveryPrice}` : 'Free';
  document.getElementById('sumTotal').textContent = `Ghc${total}`;

  localStorage.setItem('voltixCheckoutSummary', JSON.stringify({
    subtotal, discount, delivery: selectedDeliveryPrice, total,
    deliveryMethod: selectedDeliveryMethod,
    couponCode: appliedCoupon ? appliedCoupon.code : null
  }));
}

initVoltixApp('cart', function(){ renderCartPage(); });

const origUpdateBadgesCart = updateNavBadges;
updateNavBadges = function(){
  origUpdateBadgesCart();
  const b2 = document.getElementById('navCartCount2');
  if(b2){ const c=cartCount(); b2.textContent=c; b2.style.display=c>0?'flex':'none'; }
};
updateNavBadges();
</script>
</body>
</html>
