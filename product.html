<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Shop premium earpods at Voltix Pro GH.">
<title>Product — Voltix Pro GH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{padding-bottom:6.4rem;}
#pdpLoading{padding:4rem 1.1rem;text-align:center;color:var(--text-muted);font-size:.85rem;}
#pdpNotFound{display:none;padding:4rem 1.5rem;text-align:center;}
#pdpNotFound .icon{font-size:3rem;margin-bottom:1rem;}
#pdpNotFound p{color:var(--text-secondary);margin-bottom:1.4rem;font-size:.88rem;}
#pdpNotFound a{display:inline-block;background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));color:#fff;font-weight:800;padding:.85rem 1.6rem;border-radius:.8rem;font-size:.85rem;}
#pdpContent{display:none;}
.pdp-back-row{padding:.9rem 1.1rem 0;}
.pdp-back-btn{width:2.3rem;height:2.3rem;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:1.05rem;}
.pdp-addbtn{font-size:.78rem;padding:.85rem .5rem;}
.pdp-addbtn.buy{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:var(--navy-deep);box-shadow:0 8px 24px rgba(250,204,21,.3);}

/* ===== CUSTOMER REVIEWS ===== */
.pdp-reviews-section{padding:.2rem 1.1rem 0;margin-top:.4rem;}
.pdp-reviews-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.pdp-reviews-head h4{font-size:.95rem;font-weight:900;}
.pdp-reviews-summary{display:flex;align-items:center;gap:.5rem;margin-bottom:1.1rem;}
.pdp-reviews-avg{font-size:1.6rem;font-weight:900;color:var(--gold);}
.pdp-reviews-meta{font-size:.72rem;color:var(--text-muted);}
.pdp-write-review-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:.72rem;padding:.55rem 1rem;border-radius:999px;}
.pdp-reviews-list{display:flex;flex-direction:column;gap:.8rem;margin-bottom:1rem;}
.pdp-review-empty{font-size:.8rem;color:var(--text-muted);padding:1rem 0;text-align:center;}
.pdp-review-photo{width:100%;max-width:160px;border-radius:.7rem;margin-top:.6rem;display:block;}
.pdp-review-form{display:none;padding:1.1rem;margin-bottom:1.3rem;}
.pdp-review-form.active{display:block;}
.pdp-review-form h4{font-size:.85rem;font-weight:900;margin-bottom:.9rem;}
.pdp-star-picker{display:flex;gap:.4rem;margin-bottom:1rem;}
.pdp-star-btn{background:none;border:none;font-size:1.6rem;color:rgba(255,255,255,.25);line-height:1;}
.pdp-star-btn.active{color:var(--gold);}
.pdp-review-form label{display:block;font-size:.68rem;font-weight:800;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;}
.pdp-review-form .field{margin-bottom:1rem;}
.pdp-review-input,.pdp-review-textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:.75rem .9rem;border-radius:.7rem;font-size:.82rem;font-family:inherit;}
.pdp-review-textarea{resize:vertical;min-height:5rem;}
.pdp-review-input::placeholder,.pdp-review-textarea::placeholder{color:var(--text-muted);}
.pdp-review-file-row{display:flex;align-items:center;gap:.7rem;}
.pdp-review-file-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:.75rem;font-weight:700;padding:.6rem 1rem;border-radius:.7rem;}
.pdp-review-file-name{font-size:.7rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pdp-review-submit-btn{width:100%;background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));color:#fff;font-weight:800;padding:.95rem;border-radius:.8rem;border:none;font-size:.85rem;margin-top:.3rem;}
.pdp-review-submit-btn:disabled{opacity:.5;pointer-events:none;}
.pdp-review-upload-progress{font-size:.72rem;color:var(--blue-electric);margin-top:.5rem;display:none;}
</style>
</head>
<body>

<header class="app-topbar">
  <a href="home.html" class="topbar-logo">
    <img src="logo.png" alt="Voltix Pro GH" onerror="this.style.display='none'">
    <div class="topbar-logo-text"><b>VOLTIX</b><span>PRO GH</span></div>
  </a>
  <div class="topbar-icons">
    <button class="icon-btn" onclick="toggleStoreMusic()" id="musicToggleBtn">🎵</button>
    <button class="icon-btn" onclick="toggleMusicPlaylist()" aria-label="Choose a song">☰</button>
    <a href="showcase.html" class="icon-btn" aria-label="3D Product Showcase">🎬</a>
    <a href="wishlist.html" class="icon-btn">♡<span class="icon-badge" id="navWishCount" style="display:none;">0</span></a>
    <a href="cart.html" class="icon-btn">🛒<span class="icon-badge" id="navCartCount" style="display:none;">0</span></a>
  </div>
</header>

<div class="playlist-panel" id="musicPlaylistPanel">
  <div class="playlist-header"><b>🎵 Store Playlist</b><button onclick="toggleMusicPlaylist()">✕</button></div>
  <div id="musicPlaylistList"></div>
</div>

<audio id="storeAudio"></audio>

<div class="pdp-back-row">
  <button class="pdp-back-btn" onclick="history.length>1?history.back():(window.location.href='shop.html')" aria-label="Go back">← Back</button>
</div>

<div id="pdpLoading">Loading product...</div>

<div id="pdpNotFound">
  <div class="icon">🔍</div>
  <p>We couldn't find that product. It may have been removed.</p>
  <a href="shop.html">Back to Shop</a>
</div>

<div id="pdpContent">
  <div class="pdp-gallery" id="pdpGallery" style="margin:.9rem 1.1rem 0;width:calc(100% - 2.2rem);">
    <div class="pdp-gallery-track" id="pdpGalleryTrack"></div>
    <div class="pdp-dots" id="pdpDots"></div>
    <button class="pdp-download-btn" onclick="downloadProductImage()" aria-label="Download product image">⬇️</button>
  </div>
  <div class="pdp-thumbs" id="pdpThumbs" style="margin:0 1.1rem;"></div>

  <div id="pdpVariantSwatches"></div>

  <div class="pdp-body">
    <div id="pdpStockBadge"></div>
    <div class="pdp-badge-wrap" id="pdpBadgeWrap"></div>
    <div class="pdp-name" id="pdpName"></div>
    <div class="pdp-rating" id="pdpRating"></div>
    <div class="pdp-price-row">
      <span class="pdp-price" id="pdpPrice"></span>
      <span class="pdp-oldprice" id="pdpOldPrice"></span>
    </div>
    <div style="font-size:.72rem;font-weight:800;color:var(--gold);margin:-.6rem 0 1.1rem;" id="pdpCommission"></div>

    <div class="glass-card pdp-specs-card">
      <h4>Specifications</h4>
      <p id="pdpSpecs"></p>
    </div>

    <div class="pdp-qty-row">
      <span class="lbl">Quantity</span>
      <button class="pdp-qty-btn" onclick="changePdpQty(-1)">−</button>
      <span class="pdp-qty-val" id="pdpQtyVal">1</span>
      <button class="pdp-qty-btn" onclick="changePdpQty(1)">+</button>
    </div>

    <div class="pdp-trust-row">
      <span class="pdp-trust-chip">🔒 Secure Checkout</span>
      <span class="pdp-trust-chip">🚚 Fast Delivery in Ghana</span>
      <span class="pdp-trust-chip">✅ 30-Day Warranty</span>
    </div>
  </div>

  <div class="pdp-reviews-section">
    <div class="pdp-reviews-head">
      <h4>Customer Reviews</h4>
      <button type="button" class="pdp-write-review-btn" onclick="toggleReviewForm()">✍️ Write a Review</button>
    </div>
    <div class="pdp-reviews-summary" id="pdpReviewsSummary" style="display:none;">
      <span class="pdp-reviews-avg" id="pdpReviewsAvg"></span>
      <span class="pdp-reviews-meta" id="pdpReviewsMeta"></span>
    </div>

    <div class="glass-card pdp-review-form" id="pdpReviewForm">
      <h4>Share your experience</h4>
      <div class="field">
        <label>Your Rating</label>
        <div class="pdp-star-picker" id="pdpStarPicker">
          <button type="button" class="pdp-star-btn" data-star="1">★</button>
          <button type="button" class="pdp-star-btn" data-star="2">★</button>
          <button type="button" class="pdp-star-btn" data-star="3">★</button>
          <button type="button" class="pdp-star-btn" data-star="4">★</button>
          <button type="button" class="pdp-star-btn" data-star="5">★</button>
        </div>
      </div>
      <div class="field">
        <label>Your Name</label>
        <input type="text" class="pdp-review-input" id="pdpReviewName" placeholder="e.g. Ama K.">
      </div>
      <div class="field">
        <label>Your Review</label>
        <textarea class="pdp-review-textarea" id="pdpReviewComment" placeholder="How was the sound, comfort, battery life..."></textarea>
      </div>
      <div class="field">
        <label>Photo (optional)</label>
        <div class="pdp-review-file-row">
          <button type="button" class="pdp-review-file-btn" onclick="document.getElementById('pdpReviewPhotoInput').click()">📷 Add Photo</button>
          <span class="pdp-review-file-name" id="pdpReviewFileName">No file chosen</span>
        </div>
        <input type="file" accept="image/*" id="pdpReviewPhotoInput" style="display:none;">
        <div class="pdp-review-upload-progress" id="pdpReviewUploadProgress"></div>
      </div>
      <button type="button" class="pdp-review-submit-btn" id="pdpReviewSubmitBtn" onclick="submitReview()">Submit Review</button>
    </div>

    <div class="pdp-reviews-list" id="pdpReviewsList">
      <div class="pdp-review-empty">Loading reviews...</div>
    </div>
  </div>
</div>

<div class="pdp-sticky-bar" id="pdpStickyBar" style="display:none;">
  <button class="pdp-wish-btn" id="pdpWishBtn" onclick="pdpToggleWish()">♡</button>
  <a class="pdp-wa-btn" id="pdpWaBtn" href="#" target="_blank" rel="noopener" aria-label="Ask on WhatsApp">💬</a>
  <button class="pdp-addbtn ripple" id="pdpAddBtn" style="background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));" onclick="pdpAddToCart()">🛒 Add to Cart</button>
  <button class="pdp-addbtn buy ripple" id="pdpBuyBtn" onclick="pdpBuyNow()">⚡ Buy Now</button>
</div>

<script src="app.js"></script>
<script>
let currentProduct = null;
let pdpQty = 1;
let pdpActiveVariantIndex = -1;
let pdpActiveImageIndex = 0;

const pdpParams = new URLSearchParams(window.location.search);
const pdpProductId = pdpParams.get('id');

function pdpGetActiveVariant(){
  if(pdpActiveVariantIndex < 0) return null;
  return (currentProduct.variants || [])[pdpActiveVariantIndex] || null;
}
function pdpGetActiveImages(){
  const v = pdpGetActiveVariant();
  if(v && v.images && v.images.length) return v.images;
  if(currentProduct.images && currentProduct.images.length) return currentProduct.images;
  return currentProduct.imageUrl ? [currentProduct.imageUrl] : [];
}

function renderPdpGallery(images){
  const track = document.getElementById('pdpGalleryTrack');
  const dots = document.getElementById('pdpDots');
  const thumbs = document.getElementById('pdpThumbs');
  if(!images.length){
    track.innerHTML = `<div class="pdp-gallery-slide">${currentProduct.emoji || '🎧'}</div>`;
    dots.innerHTML = ''; thumbs.innerHTML = '';
    return;
  }
  track.innerHTML = images.map((img,i) => `<div class="pdp-gallery-slide">${mediaTagHTML(img, currentProduct.name, i===0?'fetchpriority="high"':'', 'f_auto,q_auto,w_900', i===0)}</div>`).join('');
  dots.innerHTML = images.length > 1 ? images.map((_,i)=>`<span class="pdp-dot ${i===0?'active':''}"></span>`).join('') : '';
  thumbs.innerHTML = images.length > 1 ? images.map((img,i)=>`<button type="button" class="pdp-thumb ${i===0?'active':''}" onclick="pdpGoToImage(${i})">${mediaTagHTML(img, currentProduct.name, '', 'f_auto,q_auto,w_150')}</button>`).join('') : '';
  pdpActiveImageIndex = 0;
  track.onscroll = () => {
    const idx = Math.round(track.scrollLeft / track.clientWidth);
    if(idx === pdpActiveImageIndex) return;
    pdpActiveImageIndex = idx;
    document.querySelectorAll('#pdpDots .pdp-dot').forEach((d,i)=>d.classList.toggle('active', i===idx));
    document.querySelectorAll('#pdpThumbs .pdp-thumb').forEach((t,i)=>t.classList.toggle('active', i===idx));
  };
}
function pdpGoToImage(i){
  const track = document.getElementById('pdpGalleryTrack');
  track.scrollTo({ left: i * track.clientWidth, behavior:'smooth' });
}

function renderStockBadge(p){
  const el = document.getElementById('pdpStockBadge');
  const addBtn = document.getElementById('pdpAddBtn');
  const buyBtn = document.getElementById('pdpBuyBtn');
  if(typeof p.stock !== 'number'){
    el.innerHTML = '';
    addBtn.disabled = false; buyBtn.disabled = false;
    return;
  }
  if(p.stock <= 0){
    el.innerHTML = `<span class="pdp-stock-badge pdp-stock-out">Out of Stock</span>`;
    addBtn.disabled = true; buyBtn.disabled = true;
  } else if(p.stock <= 5){
    el.innerHTML = `<span class="pdp-stock-badge pdp-stock-low">Only ${p.stock} left</span>`;
    addBtn.disabled = false; buyBtn.disabled = false;
  } else {
    el.innerHTML = `<span class="pdp-stock-badge pdp-stock-in">In Stock</span>`;
    addBtn.disabled = false; buyBtn.disabled = false;
  }
}

function renderVariantSwatches(p){
  const wrap = document.getElementById('pdpVariantSwatches');
  if(!p.variants || p.variants.length < 2){ wrap.innerHTML = ''; wrap.className=''; return; }
  wrap.className = 'pdp-variant-swatches';
  wrap.innerHTML = p.variants.map((v,i)=>{
    const thumb = (v.images && v.images[0]) ? v.images[0] : null;
    const bg = thumb ? `background-image:url('${thumb}');background-size:cover;background-position:center;` : 'background:#333;';
    return `<button type="button" class="pdp-swatch-item ${i===pdpActiveVariantIndex?'active':''}" onclick="pdpSelectVariant(${i})">
      <span class="pdp-swatch-dot" style="${bg}"></span>
      <span>${v.name}</span>
    </button>`;
  }).join('');
}
function pdpSelectVariant(i){
  pdpActiveVariantIndex = i;
  renderPDP();
}

function renderPDP(){
  const p = currentProduct;
  document.getElementById('pdpLoading').style.display = 'none';
  document.getElementById('pdpNotFound').style.display = 'none';
  document.getElementById('pdpContent').style.display = 'block';
  document.getElementById('pdpStickyBar').style.display = 'flex';

  const v = pdpGetActiveVariant();
  renderPdpGallery(pdpGetActiveImages());

  document.getElementById('pdpBadgeWrap').innerHTML = p.badge ? `<span class="pcard-badge ${p.badgeClass||''}">${p.badge}</span>` : '';
  document.getElementById('pdpName').textContent = v ? `${p.name} — ${v.name}` : p.name;

  const reviewCount = p.reviewCount || Math.floor(Math.random()*80)+20;
  document.getElementById('pdpRating').innerHTML = `★★★★★ <span class="count">(${reviewCount} reviews)</span>`;

  const price = v ? v.price : p.price;
  document.getElementById('pdpPrice').textContent = 'Ghc' + price;
  document.getElementById('pdpOldPrice').textContent = p.oldPrice ? 'Ghc' + p.oldPrice : '';
  document.getElementById('pdpCommission').textContent = `💸 Earn Ghc${getCommissionForPrice(price)} referring this`;
  document.getElementById('pdpSpecs').textContent = p.specs || 'Premium sound quality, comfortable fit, long battery life.';

  renderStockBadge(p);
  renderVariantSwatches(p);

  document.getElementById('pdpQtyVal').textContent = pdpQty;

  const wishActive = isWishlisted(p.id);
  const wishBtn = document.getElementById('pdpWishBtn');
  wishBtn.textContent = wishActive ? '♥' : '♡';
  wishBtn.classList.toggle('active', wishActive);

  const waText = encodeURIComponent(`Hi Voltix Pro GH! I'm interested in the ${p.name}${v?' ('+v.name+')':''} — Ghc${price}. Is it available?`);
  document.getElementById('pdpWaBtn').href = `https://wa.me/233536193862?text=${waText}`;

  document.title = `${p.name} — Voltix Pro GH`;
}

function changePdpQty(delta){
  pdpQty = Math.max(1, pdpQty + delta);
  document.getElementById('pdpQtyVal').textContent = pdpQty;
}

function pdpToggleWish(){
  if(!currentProduct) return;
  toggleWishlist(currentProduct.id);
  const wishActive = isWishlisted(currentProduct.id);
  const btn = document.getElementById('pdpWishBtn');
  btn.textContent = wishActive ? '♥' : '♡';
  btn.classList.toggle('active', wishActive);
}

function pdpAddToCart(){
  if(!currentProduct) return;
  const variant = pdpGetActiveVariant();
  if(currentProduct.variants && currentProduct.variants.length > 1 && !variant){
    showToast('Please choose a colour first');
    return;
  }
  addToCart(currentProduct.id, pdpQty, variant);
  setTimeout(()=>{ window.location.href = 'cart.html'; }, 450);
}
function pdpBuyNow(){
  if(!currentProduct) return;
  const variant = pdpGetActiveVariant();
  if(currentProduct.variants && currentProduct.variants.length > 1 && !variant){
    showToast('Please choose a colour first');
    return;
  }
  addToCart(currentProduct.id, pdpQty, variant);
  window.location.href = 'checkout.html';
}

function downloadProductImage(){
  const images = pdpGetActiveImages();
  const img = images[pdpActiveImageIndex] || images[0];
  if(!img) return;
  fetch(img).then(res=>res.blob()).then(blob=>{
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = currentProduct.name.replace(/\s+/g,'_') + '.jpg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
  }).catch(()=> window.open(img, '_blank'));
}

/* ===== CUSTOMER REVIEWS ===== */
let pdpReviews = [];
let pdpReviewRating = 0;
let pdpReviewPhotoFile = null;

function subscribeToPdpReviews(productId){
  VDB.subscribeReviewsForProduct(productId, list=>{
    pdpReviews = list;
    renderPdpReviews();
  });
}

function renderPdpReviews(){
  const listEl = document.getElementById('pdpReviewsList');
  const summaryEl = document.getElementById('pdpReviewsSummary');
  if(!pdpReviews.length){
    summaryEl.style.display = 'none';
    listEl.innerHTML = '<div class="pdp-review-empty">No reviews yet — be the first to share your experience!</div>';
    return;
  }
  const avg = pdpReviews.reduce((s,r)=>s+(r.rating||0),0) / pdpReviews.length;
  summaryEl.style.display = 'flex';
  document.getElementById('pdpReviewsAvg').textContent = avg.toFixed(1);
  document.getElementById('pdpReviewsMeta').textContent = `out of 5 · ${pdpReviews.length} review${pdpReviews.length>1?'s':''}`;

  listEl.innerHTML = pdpReviews.map(r=>{
    const initial = (r.name||'A').trim().charAt(0).toUpperCase();
    const stars = '★'.repeat(r.rating||0) + '☆'.repeat(5-(r.rating||0));
    const date = r.createdAt ? new Date(r.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
    return `
    <div class="glass-card review-card" style="min-width:0;width:100%;">
      <div class="review-top">
        <div class="review-author">
          <div class="review-avatar">${initial}</div>
          <div><b>${r.name||'Anonymous'}</b><span style="display:block;">${date}</span></div>
        </div>
        <div class="review-stars">${stars}</div>
      </div>
      <div class="review-quote" style="font-style:normal;">${r.comment||''}</div>
      ${r.photo ? `<img class="pdp-review-photo" src="${cldOptimize(r.photo,'f_auto,q_auto,w_400')}" alt="Customer photo" loading="lazy" decoding="async">` : ''}
    </div>`;
  }).join('');
}

function toggleReviewForm(){
  document.getElementById('pdpReviewForm').classList.toggle('active');
}

document.getElementById('pdpStarPicker').addEventListener('click', e=>{
  const btn = e.target.closest('.pdp-star-btn');
  if(!btn) return;
  pdpReviewRating = Number(btn.dataset.star);
  document.querySelectorAll('.pdp-star-btn').forEach(b=>{
    b.classList.toggle('active', Number(b.dataset.star) <= pdpReviewRating);
  });
});

document.getElementById('pdpReviewPhotoInput').addEventListener('change', e=>{
  pdpReviewPhotoFile = e.target.files[0] || null;
  document.getElementById('pdpReviewFileName').textContent = pdpReviewPhotoFile ? pdpReviewPhotoFile.name : 'No file chosen';
});

async function submitReview(){
  if(!currentProduct) return;
  const name = document.getElementById('pdpReviewName').value.trim();
  const comment = document.getElementById('pdpReviewComment').value.trim();
  if(!pdpReviewRating){ showToast('Please pick a star rating'); return; }
  if(!name){ showToast('Please enter your name'); return; }
  if(!comment){ showToast('Please write a short review'); return; }

  const btn = document.getElementById('pdpReviewSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  const progressEl = document.getElementById('pdpReviewUploadProgress');

  try{
    let photoUrl = null;
    if(pdpReviewPhotoFile){
      progressEl.style.display = 'block';
      progressEl.textContent = 'Uploading photo...';
      photoUrl = await VDB.uploadReviewImage(pdpReviewPhotoFile, pct=>{ progressEl.textContent = `Uploading photo... ${pct}%`; });
    }
    await VDB.addReview({
      productId: currentProduct.id,
      name,
      rating: pdpReviewRating,
      comment,
      photo: photoUrl
    });
    showToast('Thanks! Your review is pending approval.');
    document.getElementById('pdpReviewName').value = '';
    document.getElementById('pdpReviewComment').value = '';
    document.getElementById('pdpReviewFileName').textContent = 'No file chosen';
    pdpReviewPhotoFile = null;
    pdpReviewRating = 0;
    document.querySelectorAll('.pdp-star-btn').forEach(b=>b.classList.remove('active'));
    progressEl.style.display = 'none';
    document.getElementById('pdpReviewForm').classList.remove('active');
  } catch(err){
    showToast(err.message || 'Failed to submit review');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Review';
  }
}

function pdpLoad(list){
  const found = list.find(x=>String(x.id)===String(pdpProductId));
  if(!found){
    document.getElementById('pdpLoading').style.display = 'none';
    document.getElementById('pdpNotFound').style.display = 'block';
    return;
  }
  const isFirstLoad = !currentProduct;
  currentProduct = found;
  if(isFirstLoad){
    trackRecentlyViewed(currentProduct.id);
    pdpActiveVariantIndex = (currentProduct.variants && currentProduct.variants.length > 1) ? 0 : -1;
    subscribeToPdpReviews(currentProduct.id);
  }
  renderPDP();
}

if(!pdpProductId){
  document.getElementById('pdpLoading').style.display = 'none';
