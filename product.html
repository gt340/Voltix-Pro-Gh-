<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Voltix Pro GH — Product</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* product.html uses its own sticky Add-to-Cart bar at the bottom instead
   of the shared bottom-nav, so the two fixed bars never stack and hide
   each other (that was hiding the Add to Cart button before). */
body{ padding-bottom:0; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="app-topbar">
  <a href="home.html" class="topbar-logo">
    <img src="logo.jpg" alt="Voltix Pro GH" onerror="this.style.display='none'">
    <div class="topbar-logo-text"><b>VOLTIX</b><span>GHANA #1</span></div>
  </a>
  <div class="topbar-icons">
    <button class="icon-btn" onclick="history.back()">←</button>
    <button class="icon-btn" onclick="toggleStoreMusic()" id="musicToggleBtn">🎵</button>
    <a href="wishlist.html" class="icon-btn">♡<span class="icon-badge" id="navWishCount" style="display:none;">0</span></a>
    <a href="cart.html" class="icon-btn">🛒<span class="icon-badge" id="navCartCount" style="display:none;">0</span></a>
  </div>
</div>

<audio id="storeAudio"></audio>

<!-- PRODUCT DETAIL ROOT -->
<div id="pdpRoot">
  <div class="section" style="padding-top:1rem;">
    <div class="pdp-gallery skeleton" id="pdpGallerySkeleton" style="aspect-ratio:1;"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
let pdpProduct = null;
let pdpImages = [];
let pdpActiveIndex = 0;
let pdpQty = 1;

function initProductPage(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id){ window.location.href = 'shop.html'; return; }

  function load(){
    VDB.getProductById(id).then(p=>{
      if(!p){
        document.getElementById('pdpRoot').innerHTML = '<div class="section" style="text-align:center;padding-top:3rem;"><p style="color:var(--text-muted);">Product not found.</p><a href="shop.html" class="hero-cta" style="margin-top:1rem;display:inline-flex;">Back to Shop</a></div>';
        return;
      }
      pdpProduct = p;
      pdpImages = (p.images && p.images.length) ? p.images : (p.imageUrl ? [p.imageUrl] : []);
      trackRecentlyViewed(id);
      renderProductPage();
      updateNavBadges();
    });
  }
  if(VDB) load(); else window.addEventListener('vdb-ready', load);
}

function renderProductPage(){
  const p = pdpProduct;
  const wishActive = isWishlisted(p.id);

  const gallerySlides = pdpImages.length
    ? pdpImages.map(url => `<div class="pdp-gallery-slide"><img src="${url}" alt="${p.name}"></div>`).join('')
    : `<div class="pdp-gallery-slide">${p.emoji||'🎧'}</div>`;

  const dots = pdpImages.length > 1
    ? `<div class="pdp-dots">${pdpImages.map((_,i)=>`<span class="pdp-dot ${i===0?'active':''}" data-i="${i}"></span>`).join('')}</div>`
    : '';

  const thumbs = pdpImages.length > 1
    ? `<div class="pdp-thumbs">${pdpImages.map((url,i)=>`<button type="button" class="pdp-thumb ${i===0?'active':''}" data-i="${i}" onclick="pdpGoToSlide(${i})"><img src="${url}"></button>`).join('')}</div>`
    : '';

  document.getElementById('pdpRoot').innerHTML = `
    <div class="section" style="padding-top:1rem;padding-bottom:6.5rem;">
      <div class="pdp-gallery" id="pdpGallery">
        <div class="pdp-gallery-track" id="pdpGalleryTrack">${gallerySlides}</div>
        ${dots}
      </div>
      ${thumbs}
      <div class="pdp-body">
        <div class="pdp-badge-wrap">${p.badge ? `<span class="pcard-badge ${p.badgeClass||''}">${p.badge}</span>` : ''}</div>
        <h1 class="pdp-name">${p.name}</h1>
        <div class="pdp-rating">★★★★★ <span class="count">(${p.reviewCount||Math.floor(Math.random()*80)+20} reviews)</span></div>
        <div class="pdp-price-row">
          <span class="pdp-price">Ghc${p.price}</span>
          ${p.oldPrice ? `<span class="pdp-oldprice">Ghc${p.oldPrice}</span>` : ''}
        </div>
        <div class="glass-card pdp-specs-card">
          <h4>Details</h4>
          <p>${p.specs || 'Premium sound quality, built for everyday use.'}</p>
        </div>
        <div class="pdp-qty-row">
          <span class="lbl">Quantity</span>
          <button type="button" class="pdp-qty-btn" onclick="pdpChangeQty(-1)">−</button>
          <span class="pdp-qty-val" id="pdpQtyVal">1</span>
          <button type="button" class="pdp-qty-btn" onclick="pdpChangeQty(1)">+</button>
        </div>
        <div class="pdp-trust-row">
          <span class="pdp-trust-chip">🚚 1-3 Day Delivery</span>
          <span class="pdp-trust-chip">✅ 7-Day Warranty</span>
          <span class="pdp-trust-chip">💳 Secure Payment</span>
          <span class="pdp-trust-chip" style="color:var(--gold);border-color:rgba(250,204,21,.35);background:rgba(250,204,21,.08);">💸 Earn Ghc${getCommissionForPrice(p.price)} — Refer &amp; Earn</span>
        </div>
      </div>
    </div>
    <div class="pdp-sticky-bar">
      <button type="button" class="pdp-wish-btn ${wishActive?'active':''}" id="pdpWishBtn" onclick="pdpToggleWishlist()">${wishActive?'♥':'♡'}</button>
      <button type="button" class="pdp-addbtn ripple" onclick="pdpAddToCart(event)">🛒 Add to Cart</button>
    </div>
  `;

  const track = document.getElementById('pdpGalleryTrack');
  if(track && pdpImages.length > 1){
    track.addEventListener('scroll', pdpOnGalleryScroll);
  }
}

function pdpOnGalleryScroll(){
  const track = document.getElementById('pdpGalleryTrack');
  const index = Math.round(track.scrollLeft / track.clientWidth);
  if(index === pdpActiveIndex) return;
  pdpActiveIndex = index;
  document.querySelectorAll('.pdp-dot').forEach((d,i)=>d.classList.toggle('active', i===index));
  document.querySelectorAll('.pdp-thumb').forEach((t,i)=>t.classList.toggle('active', i===index));
}
function pdpGoToSlide(i){
  const track = document.getElementById('pdpGalleryTrack');
  track.scrollTo({ left: i * track.clientWidth, behavior:'smooth' });
}

function pdpChangeQty(delta){
  pdpQty = Math.max(1, pdpQty + delta);
  document.getElementById('pdpQtyVal').textContent = pdpQty;
}
function pdpAddToCart(e){
  for(let i=0;i<pdpQty;i++) addToCart(pdpProduct.id, 1);
  rippleFx(e);
  setTimeout(()=>{ window.location.href = 'cart.html'; }, 450);
}
function pdpToggleWishlist(){
  toggleWishlist(pdpProduct.id);
  const btn = document.getElementById('pdpWishBtn');
  btn.classList.toggle('active', isWishlisted(pdpProduct.id));
  btn.textContent = isWishlisted(pdpProduct.id) ? '♥' : '♡';
}

/* ===== STORE MUSIC (plays through all uploaded tracks) ===== */
let storeTracks = [];
let storeTrackIndex = 0;
let musicPlaying = false;
function loadStoreMusic(){
  function apply(){
    VDB.getMusicTracks().then(tracks=>{ storeTracks = tracks || []; });
  }
  if(VDB) apply(); else window.addEventListener('vdb-ready', apply);
}
function toggleStoreMusic(){
  const audio = document.getElementById('storeAudio');
  const btn = document.getElementById('musicToggleBtn');
  if(!storeTracks.length){ showToast('No store music uploaded yet'); return; }
  if(musicPlaying){
    audio.pause();
    musicPlaying = false;
    btn.textContent = '🎵';
  } else {
    if(!audio.src) audio.src = storeTracks[storeTrackIndex].url;
    audio.play();
    musicPlaying = true;
    btn.textContent = '⏸';
  }
}
document.getElementById('storeAudio').addEventListener('ended', ()=>{
  if(!storeTracks.length) return;
  storeTrackIndex = (storeTrackIndex + 1) % storeTracks.length;
  const audio = document.getElementById('storeAudio');
  audio.src = storeTracks[storeTrackIndex].url;
  audio.play();
});

loadStoreMusic();
initProductPage();
</script>
</body>
</html>
