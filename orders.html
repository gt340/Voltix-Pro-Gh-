<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Orders — Voltix Pro GH</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.orders-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1.5rem;text-align:center;}
.orders-empty .ic{font-size:4rem;margin-bottom:1.2rem;opacity:.5;}
.orders-empty h3{font-size:1.15rem;font-weight:900;margin-bottom:.5rem;}
.orders-empty p{font-size:.85rem;color:var(--text-secondary);margin-bottom:1.5rem;}
.orders-empty-btn{background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));color:#fff;font-weight:800;font-size:.85rem;padding:.9rem 1.8rem;border-radius:.9rem;border:none;}

.order-filter-tabs{display:flex;gap:.5rem;padding:1rem 1.1rem;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
.order-filter-tabs::-webkit-scrollbar{display:none;}
.order-filter-tab{flex:0 0 auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text-secondary);font-size:.75rem;font-weight:700;padding:.55rem 1.1rem;border-radius:999px;white-space:nowrap;}
.order-filter-tab.active{background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));color:#fff;border-color:transparent;}

.order-card{margin:0 1.1rem 1rem;padding:1.1rem;background:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.08);border-radius:1.1rem;}
.order-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.9rem;padding-bottom:.9rem;border-bottom:1px solid rgba(255,255,255,.07);}
.order-ref{font-family:monospace;font-weight:900;font-size:1rem;color:var(--gold);}
.order-date{font-size:.68rem;color:var(--text-muted);margin-top:.2rem;}
.order-status-pill{font-size:.65rem;font-weight:800;padding:.35rem .8rem;border-radius:999px;text-transform:uppercase;white-space:nowrap;}
.status-processing{background:rgba(250,204,21,.15);color:var(--gold);border:1px solid rgba(250,204,21,.3);}
.status-packed{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3);}
.status-shipped{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.3);}
.status-delivered{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
.status-cancelled{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);}

.order-items-preview{display:flex;gap:.6rem;margin-bottom:.9rem;overflow-x:auto;}
.oi-thumb{width:52px;height:52px;border-radius:.6rem;background:linear-gradient(150deg,rgba(14,165,233,.2),rgba(30,64,175,.12));display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden;flex:0 0 auto;}
.oi-thumb img{width:100%;height:100%;object-fit:cover;}
.order-summary-line{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--text-secondary);margin-bottom:.9rem;}
.order-summary-line b{color:var(--gold);font-weight:900;font-size:.95rem;}

.order-card-btns{display:flex;gap:.6rem;flex-wrap:wrap;}
.order-card-btns button, .order-card-btns a{flex:1;min-width:100px;text-align:center;font-size:.72rem;font-weight:800;padding:.7rem;border-radius:.7rem;border:none;}
.btn-track{background:rgba(14,165,233,.15);border:1px solid rgba(14,165,233,.35);color:var(--blue-electric);}
.btn-reorder{background:linear-gradient(135deg,var(--blue-electric),var(--blue-deep));color:#fff;}
.btn-invoice{background:rgba(250,204,21,.15);border:1px solid rgba(250,204,21,.35);color:var(--gold);}

.order-detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;display:none;}
.order-detail-overlay.active{display:block;}
.order-detail-sheet{position:fixed;left:0;right:0;bottom:0;z-index:151;background:var(--navy-mid);border-radius:1.5rem 1.5rem 0 0;border-top:1px solid rgba(255,255,255,.1);padding:1.3rem 1.1rem calc(1.3rem + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);max-height:85vh;overflow-y:auto;}
.order-detail-sheet.active{transform:translateY(0);}
.ods-handle{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:99px;margin:0 auto 1.1rem;}
.ods-item-row{display:flex;gap:.7rem;padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.06);}
.ods-close{position:absolute;top:1rem;right:1.1rem;background:rgba(255,255,255,.08);border:none;color:#fff;width:2rem;height:2rem;border-radius:50%;font-size:1rem;}
</style>
</head>
<body>

<header class="app-topbar">
  <a href="account.html" class="icon-btn">←</a>
  <div style="font-weight:800;font-size:.95rem;">My Orders</div>
  <div style="width:2.5rem;"></div>
</header>

<div id="ordersEmptyState" class="orders-empty" style="display:none;">
  <div class="ic">📦</div>
  <h3>No orders yet</h3>
  <p>Your order history will appear here once you shop with us</p>
  <a href="shop.html" class="orders-empty-btn ripple">🛍️ Start Shopping</a>
</div>

<div id="ordersContent">
  <div class="order-filter-tabs" id="orderFilterTabs">
    <button class="order-filter-tab active" data-filter="all">All Orders</button>
    <button class="order-filter-tab" data-filter="Processing">Processing</button>
    <button class="order-filter-tab" data-filter="Packed">Packed</button>
    <button class="order-filter-tab" data-filter="Shipped">Shipped</button>
    <button class="order-filter-tab" data-filter="Delivered">Delivered</button>
  </div>
  <div id="ordersList"></div>
</div>

<!-- ORDER DETAIL BOTTOM SHEET -->
<div class="order-detail-overlay" id="odOverlay" onclick="closeOrderDetail()"></div>
<div class="order-detail-sheet" id="odSheet">
  <div class="ods-handle"></div>
  <button class="ods-close" onclick="closeOrderDetail()">✕</button>
  <h3 style="font-size:1.05rem;font-weight:900;margin-bottom:.3rem;" id="odRef"></h3>
  <div style="font-size:.75rem;color:var(--text-muted);margin-bottom:1.2rem;" id="odDate"></div>

  <div class="os-timeline" style="margin-bottom:1.2rem;">
    <div class="os-tl-line"></div>
    <div class="os-tl-step" id="odStep0"><div class="os-tl-dot">✅</div><span>Confirmed</span></div>
    <div class="os-tl-step" id="odStep1"><div class="os-tl-dot">📦</div><span>Packed</span></div>
    <div class="os-tl-step" id="odStep2"><div class="os-tl-dot">🚚</div><span>Shipped</span></div>
    <div class="os-tl-step" id="odStep3"><div class="os-tl-dot">🏠</div><span>Delivered</span></div>
  </div>

  <div id="odItemsList" style="margin-bottom:1.2rem;"></div>

  <div class="os-details" style="margin-bottom:1.2rem;">
    <div class="os-detail-row"><span class="lbl">📍 Delivery To</span><span class="val" id="odAddress">-</span></div>
    <div class="os-detail-row"><span class="lbl">💳 Payment</span><span class="val" id="odPayment">-</span></div>
    <div class="os-detail-row"><span class="lbl">💰 Total</span><span class="val" id="odTotal">-</span></div>
  </div>

  <a href="track-order.html" class="os-btn-primary ripple" style="display:block;text-align:center;text-decoration:none;">📍 Track This Order</a>
</div>

<nav class="bottom-nav">
  <a href="home.html" class="nav-item" data-page="home"><span class="nav-icon">🏠</span>Home</a>
  <a href="shop.html" class="nav-item" data-page="shop"><span class="nav-icon">🛍️</span>Shop</a>
  <a href="cart.html" class="nav-item" data-page="cart"><span class="nav-icon">🛒</span>Cart<span class="nav-count" id="navCartCount2" style="display:none;">0</span></a>
  <a href="account.html" class="nav-item" data-page="account"><span class="nav-icon">👤</span>Account</a>
</nav>

<script src="app.js"></script>
<script>
let allOrders = JSON.parse(localStorage.getItem('voltixOrders') || '[]');
let activeOrderFilter = 'all';

const STATUS_STEPS = ['Processing', 'Packed', 'Shipped', 'Delivered'];

function statusClass(status){
  return 'status-' + status.toLowerCase();
}

function renderOrdersList(){
  const emptyEl = document.getElementById('ordersEmptyState');
  const contentEl = document.getElementById('ordersContent');

  if(allOrders.length === 0){
    emptyEl.style.display = 'flex';
    contentEl.style.display = 'none';
    return;
  }
  emptyEl.style.display = 'none';
  contentEl.style.display = 'block';

  const filtered = activeOrderFilter === 'all' ? allOrders : allOrders.filter(o => o.status === activeOrderFilter);
  const listEl = document.getElementById('ordersList');

  if(filtered.length === 0){
    listEl.innerHTML = `<div style="text-align:center;padding:2.5rem 1rem;color:var(--text-muted);font-size:.85rem;">No orders in this category yet.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map((order, idx) => `
    <div class="order-card">
      <div class="order-card-top">
        <div>
          <div class="order-ref">${order.ref}</div>
          <div class="order-date">${new Date(order.date).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'})}</div>
        </div>
        <span class="order-status-pill ${statusClass(order.status)}">${order.status}</span>
      </div>
      <div class="order-items-preview">
        ${order.items.map(i => `<div class="oi-thumb">${i.imageUrl ? `<img src="${i.imageUrl}">` : (i.emoji||'🎧')}</div>`).join('')}
      </div>
      <div class="order-summary-line">
        <span>${order.items.length} item${order.items.length>1?'s':''}</span>
        <b>Ghc${order.total}</b>
      </div>
      <div class="order-card-btns">
        <button class="btn-track ripple" onclick="openOrderDetail(${allOrders.indexOf(order)})">📍 Track</button>
        <button class="btn-invoice ripple" onclick="downloadInvoice(${allOrders.indexOf(order)})">🧾 Invoice</button>
        <button class="btn-reorder ripple" onclick="reorderItems(${allOrders.indexOf(order)})">🔄 Reorder</button>
      </div>
    </div>`).join('');
}

document.getElementById('orderFilterTabs').addEventListener('click', e=>{
  const btn = e.target.closest('.order-filter-tab');
  if(!btn) return;
  document.querySelectorAll('.order-filter-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  activeOrderFilter = btn.dataset.filter;
  renderOrdersList();
});

function openOrderDetail(idx){
  const order = allOrders[idx];
  if(!order) return;

  document.getElementById('odRef').textContent = order.ref;
  document.getElementById('odDate').textContent = new Date(order.date).toLocaleString('en-GB');
  document.getElementById('odAddress').textContent = `${order.customer.address}, ${order.customer.city}`;
  document.getElementById('odPayment').textContent = order.paymentMethod;
  document.getElementById('odTotal').textContent = 'Ghc' + order.total;

  document.getElementById('odItemsList').innerHTML = order.items.map(i => `
    <div class="ods-item-row">
      <div class="oi-thumb">${i.imageUrl ? `<img src="${i.imageUrl}">` : (i.emoji||'🎧')}</div>
      <div style="flex:1;">
        <div style="font-size:.82rem;font-weight:700;">${i.name}</div>
        <div style="font-size:.72rem;color:var(--text-muted);">Qty: ${i.qty} × Ghc${i.price}</div>
      </div>
    </div>`).join('');

  const currentStepIdx = STATUS_STEPS.indexOf(order.status);
  for(let i=0;i<4;i++){
    document.getElementById('odStep'+i).classList.toggle('active', i <= currentStepIdx);
  }

  document.getElementById('odOverlay').classList.add('active');
  document.getElementById('odSheet').classList.add('active');
}
function closeOrderDetail(){
  document.getElementById('odOverlay').classList.remove('active');
  document.getElementById('odSheet').classList.remove('active');
}

function reorderItems(idx){
  const order = allOrders[idx];
  if(!order) return;
  order.items.forEach(item => {
    const existing = cart.find(c => String(c.id) === String(item.id));
    if(existing) existing.qty += item.qty;
    else cart.push({...item});
  });
  saveCart();
  updateNavBadges();
  showToast('Items added to cart!');
}

/* ===== INVOICE DOWNLOAD (Phase 1) ===== */
function downloadInvoice(idx){
  const order = allOrders[idx];
  if(!order) return;

  const itemsRows = order.items.map(i => `
    <tr>
      <td style="padding:.6rem;border-bottom:1px solid #eee;">${i.name}</td>
      <td style="padding:.6rem;border-bottom:1px solid #eee;text-align:center;">${i.qty}</td>
      <td style="padding:.6rem;border-bottom:1px solid #eee;text-align:right;">Ghc${i.price}</td>
      <td style="padding:.6rem;border-bottom:1px solid #eee;text-align:right;">Ghc${i.price*i.qty}</td>
    </tr>`).join('');

  const invoiceHTML = `
<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Invoice ${order.ref}</title>
<style>
body{font-family:Arial,sans-serif;padding:2rem;color:#111;max-width:700px;margin:0 auto;}
h1{color:#0ea5e9;}
table{width:100%;border-collapse:collapse;margin-top:1.5rem;}
th{text-align:left;padding:.6rem;background:#0ea5e9;color:#fff;}
th:nth-child(2){text-align:center;} th:nth-child(3),th:nth-child(4){text-align:right;}
.total-row{font-weight:900;font-size:1.1rem;}
.header-row{display:flex;justify-content:space-between;margin-bottom:2rem;}
@media print{ body{padding:0;} }
</style></head>
<body>
  <div class="header-row">
    <div><h1>⚡ VOLTIX PRO GH</h1><p>Ghana's #1 Premium Earpods Store</p></div>
    <div style="text-align:right;"><h2>INVOICE</h2><p>${order.ref}</p><p>${new Date(order.date).toLocaleDateString('en-GB')}</p></div>
  </div>
  <p><b>Customer:</b> ${order.customer.name}<br>
  <b>Phone:</b> ${order.customer.phone}<br>
  <b>Delivery Address:</b> ${order.customer.address}, ${order.customer.city}</p>
  <table>
    <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
    <tbody>${itemsRows}</tbody>
    <tfoot><tr class="total-row"><td colspan="3" style="text-align:right;padding:.8rem .6rem;">Total</td><td style="text-align:right;padding:.8rem .6rem;">Ghc${order.total}</td></tr></tfoot>
  </table>
  <p style="margin-top:2rem;">Payment Method: ${order.paymentMethod}<br>Status: ${order.status}</p>
  <p style="margin-top:2rem;color:#888;font-size:.85rem;">Thank you for shopping with Voltix Pro GH — A Trust God Company Brand.</p>
</body></html>`;

  const blob = new Blob([invoiceHTML], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Invoice-${order.ref}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

initVoltixApp('account', renderOrdersList);

const origUpdateBadgesOrd = updateNavBadges;
updateNavBadges = function(){
  origUpdateBadgesOrd();
  const b2 = document.getElementById('navCartCount2');
  if(b2){ const c=cartCount(); b2.textContent=c; b2.style.display=c>0?'flex':'none'; }
};
updateNavBadges();
</script>
</body>
                                                                         </html>
